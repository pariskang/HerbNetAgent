[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "herbnetagent"
version = "2.0.0"
description = "Quantitative multi-scale TCM intelligence agent (efficacy + PK, evidence-graded)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "numpy>=1.23",
    "scipy>=1.9",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]

[project.scripts]
herbnetagent = "herbnetagent.cli:main"

[tool.setuptools]
packages = ["herbnetagent"]
